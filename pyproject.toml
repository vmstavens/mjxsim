[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mjxsim"
version = "0.1.0"
description = "MuJoCo + Brax simulation utilities, datasets, and RL agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Victor Melbye Staven" }]
dependencies = [
    "numpy",
    "packaging",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.9.0.1"]
datasets = [
    "gdown",
    "opencv-python",
    "pandas",
    "pillow",
    "torch",
    "tqdm",
    "zarr",
]
diffusion = ["diffusers>=0.36.0", "torch", "wandb"]
envs = [
    "gym>=0.26",
    "gym-pusht",
    "gymnasium>=0.28",
    "pygame",
    "pymunk",
    "shapely",
]
examples = [
    "brax>=0.14.1",
    "diffusers>=0.36.0",
    "gdown",
    "gym>=0.26",
    "gym-pusht",
    "gymnasium>=0.28",
    "jax",
    "jaxlib",
    "jaxlie>=1.5.0",
    "matplotlib>=3.10.8",
    "ml-collections",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.4.0",
    "opencv-python",
    "pandas",
    "pillow",
    "playground>=0.1.0",
    "pygame",
    "pymunk",
    "shapely",
    "skrl>=2.0.0",
    "torch",
    "tqdm",
    "tyro",
    "zarr",
]
mujoco = [
    "absl-py",
    "brax>=0.14.1",
    "dm-control",
    "etils",
    "flax",
    "glfw",
    "jax",
    "jaxlib",
    "jaxlie>=1.5.0",
    "ml-collections",
    "matplotlib>=3.10.8",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.4.0",
    "playground>=0.1.0",
    "robot-descriptions>=1.22.0",
    "shapely",
    "tyro",
]
rl = ["skrl>=2.0.0", "torch"]
stubs = ["pybind11-stubgen>=2.5.5"]

[tool.hatch.build.targets.wheel]
packages = ["mjxsim", "agents", "datasets", "envs", "examples", "trainers", "utils"]
artifacts = ["mjxsim/py.typed"]

[tool.hatch.metadata]
allow-direct-references = true
