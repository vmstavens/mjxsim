[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mjxsim"
version = "0.1.0"
description = "MuJoCo + Brax simulation utilities, datasets, and RL agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Victor Melbye Staven" }]
dependencies = [
    "brax>=0.14.1",
    "diffusers>=0.36.0",
    "gdown",
    "gym>=0.26",
    "gym-pusht",
    "gymnasium>=0.28",
    "jax[cuda12]>=0.9.0.1",
    "jaxlie>=1.5.0",
    "matplotlib>=3.10.8",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.4.0",
    "numpy",
    "opencv-python",
    "packaging",
    "pandas",
    "pillow",
    "playground>=0.1.0",
    "pybind11-stubgen>=2.5.5",
    "pygame",
    "pymunk",
    "robot-descriptions>=1.22.0",
    "skrl>=2.0.0",
    "torch",
    "tqdm",
    "zarr",
]

[project.optional-dependencies]
diffusion = ["diffusers", "wandb"]
mujoco = [
    "absl-py",
    "brax",
    "dm-control",
    "etils",
    "flax",
    "glfw",
    "jax",
    "jaxlib",
    "jaxlie",
    "ml-collections",
    "mujoco",
    "robot_descriptions",
    "shapely",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "cli", "datasets", "envs", "sim", "trainers", "utils"]

[tool.hatch.metadata]
allow-direct-references = true
