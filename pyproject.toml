[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mjxsim"
version = "0.1.0"
description = "MuJoCo + Brax simulation utilities, datasets, and RL agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Victor Melbye Staven" }]
dependencies = [
    "absl-py",
    "brax>=0.14.1",
    "diffusers>=0.36.0",
    "dm-control",
    "etils",
    "flax",
    "gdown",
    "glfw",
    "gym>=0.26",
    "gym-pusht",
    "gymnasium>=0.28",
    "jax-cuda13-plugin>=0.9.0.1",
    "jax[cuda13]",
    "jaxlib",
    "jaxlie>=1.5.0",
    "matplotlib>=3.10.8",
    "ml-collections",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.4.0",
    "numpy",
    "opencv-python",
    "optax",
    "packaging",
    "pandas",
    "pillow",
    "playground>=0.1.0",
    "pygame",
    "pymunk",
    "robot-descriptions>=1.22.0",
    "shapely",
    "skrl>=2.1,<2.2",
    "torch",
    "tqdm",
    "tyro",
    "wandb",
    "zarr",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.9.0.1"]
datasets = [
    "gdown",
    "opencv-python",
    "pandas",
    "pillow",
    "torch",
    "tqdm",
    "zarr",
]
diffusion = ["diffusers>=0.36.0", "torch", "wandb"]
fast-diffusion = ["diffusers>=0.36.0", "mamba-ssm>=2.2,<2.3", "torch"]
envs = [
    "gym>=0.26",
    "gym-pusht",
    "gymnasium>=0.28",
    "pygame",
    "pymunk",
    "shapely",
]
examples = [
    "brax>=0.14.1",
    "diffusers>=0.36.0",
    "gdown",
    "gym>=0.26",
    "gym-pusht",
    "gymnasium>=0.28",
    "jax",
    "jaxlib",
    "jaxlie>=1.5.0",
    "matplotlib>=3.10.8",
    "ml-collections",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.4.0",
    "opencv-python",
    "pandas",
    "pillow",
    "playground>=0.1.0",
    "pygame",
    "pymunk",
    "shapely",
    "skrl>=2.1,<2.2",
    "torch",
    "torchvision>=0.25.0",
    "tqdm",
    "tyro",
    "zarr",
]
mujoco = [
    "absl-py",
    "brax>=0.14.1",
    "dm-control",
    "etils",
    "flax",
    "glfw",
    "jax",
    "jaxlib",
    "jaxlie>=1.5.0",
    "ml-collections",
    "matplotlib>=3.10.8",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.4.0",
    "playground>=0.1.0",
    "robot-descriptions>=1.22.0",
    "shapely",
    "tyro",
]
rl = ["skrl>=2.1,<2.2", "torch"]
stubs = ["pybind11-stubgen>=2.5.5"]

[tool.hatch.build.targets.wheel]
packages = ["mjxsim"]
exclude = [
    "/mjxsim/datasets",
    "/mjxsim/envs",
]
artifacts = ["mjxsim/py.typed"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/mjxsim/datasets",
    "/mjxsim/envs",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
